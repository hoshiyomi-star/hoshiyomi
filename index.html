<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星詠｜HOSHIYOMI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#020817;
  color:#f5f7ff;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}

.opening{
  position:relative;
  width:100%;
  height:100svh;
  min-height:560px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(67,83,150,.24),
      transparent 34%
    ),
    radial-gradient(
      circle at 18% 25%,
      rgba(150,135,220,.12),
      transparent 20%
    ),
    linear-gradient(
      180deg,
      #020817 0%,
      #0b1231 46%,
      #08051d 100%
    );
}

.opening:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.8;

  background-image:
    radial-gradient(
      circle at 12% 18%,
      rgba(255,255,255,.8) 0 1px,
      transparent 1.8px
    ),
    radial-gradient(
      circle at 24% 68%,
      rgba(190,210,255,.7) 0 1px,
      transparent 1.8px
    ),
    radial-gradient(
      circle at 42% 27%,
      rgba(255,255,255,.75) 0 1px,
      transparent 1.8px
    ),
    radial-gradient(
      circle at 64% 72%,
      rgba(210,220,255,.65) 0 1px,
      transparent 1.8px
    ),
    radial-gradient(
      circle at 81% 31%,
      rgba(255,255,255,.8) 0 1px,
      transparent 1.8px
    ),
    radial-gradient(
      circle at 91% 76%,
      rgba(190,205,255,.65) 0 1px,
      transparent 1.8px
    );

  background-size:
    240px 240px,
    310px 310px,
    280px 280px,
    350px 350px,
    270px 270px,
    330px 330px;
}

.opening:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 45%,
      transparent 0 35%,
      rgba(1,6,18,.08) 65%,
      rgba(1,5,15,.42) 100%
    );
}


/* =========================
   中央
========================= */

.center{
  position:absolute;
  z-index:2;

  left:50%;
  top:50%;

  width:min(94%,900px);

  transform:translate(-50%,-50%);

  text-align:center;

  animation:openingIn 1.5s ease both;
}


/* =========================
   ロゴ
========================= */

.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;

  width:100%;

  min-height:200px;
}

.logo-image{
  display:block;

  /* ロゴを大きく表示 */
  width:min(86vw,700px);

  height:auto;

  max-width:700px;
  max-height:none;

  object-fit:contain;

  filter:
    drop-shadow(
      0 0 22px rgba(220,235,255,.32)
    );
}


/* ロゴが読み込めなかった場合 */

.logo-fallback{
  display:none;

  font-size:clamp(4rem,10vw,8rem);

  font-weight:400;

  letter-spacing:.16em;

  text-shadow:
    0 0 28px rgba(220,235,255,.38);
}


/* =========================
   英字
========================= */

.en{
  margin-top:8px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(.75rem,1.5vw,1.05rem);

  letter-spacing:.62em;

  padding-left:.62em;

  opacity:.92;
}


/* =========================
   キャッチコピー
========================= */

.message{
  margin:38px 0 0;

  font-size:
    clamp(.9rem,1.6vw,1.12rem);

  letter-spacing:.14em;

  line-height:2;

  text-shadow:
    0 2px 14px rgba(0,0,0,.75);
}


/* =========================
   ENTER
========================= */

.enter{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  margin-top:32px;

  min-width:150px;

  padding:
    12px
    28px
    12px
    33px;

  border:
    1px solid
    rgba(235,242,255,.62);

  border-radius:999px;

  color:#fff;

  text-decoration:none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.78rem;

  letter-spacing:.34em;

  background:
    rgba(2,8,22,.22);

  transition:.3s ease;
}

.enter:hover{
  transform:translateY(-2px);

  background:
    rgba(235,242,255,.1);

  box-shadow:
    0 0 28px
    rgba(190,215,255,.25);
}


/* =========================
   左右の文章
========================= */

.corner{
  position:absolute;

  z-index:2;

  font-size:.7rem;

  line-height:2;

  letter-spacing:.18em;

  opacity:.76;

  text-shadow:
    0 2px 10px rgba(0,0,0,.8);
}

.left{
  left:5%;
  top:7%;
}

.right{
  right:5%;
  top:7%;

  text-align:right;
}


/* =========================
   右下
========================= */

.bottom{
  position:absolute;

  z-index:2;

  right:4%;
  bottom:5%;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.62rem;

  letter-spacing:.3em;

  opacity:.58;
}


/* =========================
   アニメーション
========================= */

@keyframes openingIn{

  from{
    opacity:0;

    transform:
      translate(-50%,-47%);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%);
  }

}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .opening{
    min-height:520px;
  }

  .center{
    width:94%;
  }

  .logo-wrap{
    min-height:160px;
  }

  .logo-image{

    width:min(92vw,600px);

    max-width:600px;

    height:auto;

    max-height:none;
  }

  .corner{
    font-size:.56rem;
  }

  .left{
    left:6%;
    top:5%;
  }

  .right{
    right:6%;
    top:5%;
  }

  .message{
    margin-top:28px;

    letter-spacing:.08em;
  }

  .enter{
    margin-top:26px;
  }

  .bottom{
    right:6%;
    bottom:4%;

    font-size:.55rem;
  }

}


/* =========================
   動きを減らす設定
========================= */

@media(prefers-reduced-motion:reduce){

  .center{
    animation:none;
  }

}
</style>
</head>


<body>

<main class="opening">

  <!-- 左上 -->
  <div class="corner left">
    言葉にならない想いを、<br>
    一枚の作品に。
  </div>


  <!-- 右上 -->
  <div class="corner right">
    きっと、どこかで、<br>
    あなたの星が待っている。
  </div>


  <!-- 中央 -->
  <div class="center">

    <!-- 星詠ロゴ -->
    <div class="logo-wrap">

      <img
        class="logo-image"
        src="logo.png"
        alt="星詠"
        onerror="
          this.style.display='none';
          document.getElementById('logoFallback').style.display='block';
        "
      >

      <div
        class="logo-fallback"
        id="logoFallback"
      >
        星詠
      </div>

    </div>


    <!-- 英字 -->
    <div class="en">
      H O S H I Y O M I
    </div>


    <!-- キャッチコピー -->
    <p class="message">
      無限に広がる夜空から、あなただけの星を。
    </p>


    <!-- ENTER -->
    <a
      class="enter"
      href="home.html"
    >
      ENTER
    </a>

  </div>


  <!-- 右下 -->
  <div class="bottom">
    A STAR FOR YOU.
  </div>

</main>

</body>
</html>

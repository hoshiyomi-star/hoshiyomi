<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星詠｜HOSHIYOMI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#020817;
  color:#f5f7ff;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}

.opening{
  position:relative;
  width:100%;
  height:100svh;
  min-height:560px;
  overflow:hidden;
  background:#020817 url("opening-bg.png") center center/cover no-repeat;
}

.opening:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 50% 45%,
      transparent 0 35%,
      rgba(1,6,18,.08) 65%,
      rgba(1,5,15,.38) 100%
    );
}

.center{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  width:min(90%,760px);
  transform:translate(-50%,-50%);
  text-align:center;
  animation:openingIn 1.8s ease both;
}

.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:clamp(90px,12vw,150px);
}

.logo-image{
  display:block;
  width:min(82vw,680px);
  max-height:280px;
  object-fit:contain;
  filter:drop-shadow(0 0 22px rgba(220,235,255,.3));
}

.message{
  margin:52px 0 0;
  font-size:clamp(.9rem,1.6vw,1.12rem);
  letter-spacing:.14em;
  line-height:2;
  text-shadow:0 2px 14px rgba(0,0,0,.75);
}

.enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:38px;
  min-width:150px;
  padding:12px 28px 12px 33px;
  border:1px solid rgba(235,242,255,.62);
  border-radius:999px;
  color:#fff;
  text-decoration:none;
  font-family:Georgia,"Times New Roman",serif;
  font-size:.78rem;
  letter-spacing:.34em;
  background:rgba(2,8,22,.2);
  backdrop-filter:blur(7px);
  transition:.3s ease;
}

.enter:hover{
  transform:translateY(-2px);
  background:rgba(235,242,255,.1);
  box-shadow:0 0 28px rgba(190,215,255,.25);
}

@keyframes openingIn{
  from{
    opacity:0;
    transform:translate(-50%,-47%);
  }

  to{
    opacity:1;
    transform:translate(-50%,-50%);
  }
}

@media(max-width:600px){

  .opening{
    min-height:520px;
    background-position:center center;
  }

  .message{
    margin-top:40px;
    letter-spacing:.08em;
  }

  .enter{
    margin-top:30px;
  }
}

@media(prefers-reduced-motion:reduce){

  .center{
    animation:none;
  }
}
</style>
</head>

<body>

<main class="opening">

  <div class="center">

    <div class="logo-wrap">

      <img
        class="logo-image"
        src="logo.png"
        alt="星詠"
      >

    </div>

    <p class="message">
      あなたの星を、詠む。
    </p>

    <a class="enter" href="home.html">
      ENTER
    </a>

  </div>

</main>

</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星詠｜HOSHIYOMI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#020817;
  color:#f5f7ff;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}

.opening{
  position:relative;
  width:100%;
  height:100svh;
  min-height:560px;
  overflow:hidden;
  background:#020817 url("opening-bg.png") center center/cover no-repeat;
}

.opening:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 50% 45%,
      transparent 0 35%,
      rgba(1,6,18,.08) 65%,
      rgba(1,5,15,.38) 100%
    );
}

.center{
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  width:min(94%,900px);
  transform:translate(-50%,-50%);
  text-align:center;
  animation:openingIn 1.8s ease both;
}

/* ロゴ */
.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  min-height:clamp(150px,20vw,240px);
}

.logo-image{
  display:block;
  width:min(82vw,700px);
  height:auto;
  max-width:700px;
  max-height:none;
  object-fit:contain;
  filter:drop-shadow(0 0 22px rgba(220,235,255,.3));
}

/* ロゴ画像が読み込めなかった場合 */
.logo-wrap .logo{
  margin:0;
}

.logo{
  font-size:clamp(4.5rem,10vw,8rem);
  font-weight:400;
  line-height:1;
  letter-spacing:.16em;
  text-shadow:0 0 28px rgba(220,235,255,.38);
}

#logoFallback{
  display:none;
}

.en{
  margin-top:8px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(.8rem,1.5vw,1.1rem);
  letter-spacing:.62em;
  padding-left:.62em;
  opacity:.94;
}

.message{
  margin:42px 0 0;
  font-size:clamp(.9rem,1.6vw,1.12rem);
  letter-spacing:.14em;
  line-height:2;
  text-shadow:0 2px 14px rgba(0,0,0,.75);
}

.enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:34px;
  min-width:150px;
  padding:12px 28px 12px 33px;
  border:1px solid rgba(235,242,255,.62);
  border-radius:999px;
  color:#fff;
  text-decoration:none;
  font-family:Georgia,"Times New Roman",serif;
  font-size:.78rem;
  letter-spacing:.34em;
  background:rgba(2,8,22,.2);
  backdrop-filter:blur(7px);
  transition:.3s ease;
}

.enter:hover{
  transform:translateY(-2px);
  background:rgba(235,242,255,.1);
  box-shadow:0 0 28px rgba(190,215,255,.25);
}

.corner{
  position:absolute;
  z-index:2;
  font-size:.7rem;
  line-height:2;
  letter-spacing:.18em;
  opacity:.76;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}

.left{
  left:5%;
  top:7%;
}

.right{
  right:5%;
  top:7%;
  text-align:right;
}

.bottom{
  position:absolute;
  z-index:2;
  right:4%;
  bottom:5%;
  font-family:Georgia,"Times New Roman",serif;
  font-size:.62rem;
  letter-spacing:.3em;
  opacity:.58;
}

@keyframes openingIn{
  from{
    opacity:0;
    transform:translate(-50%,-47%);
  }

  to{
    opacity:1;
    transform:translate(-50%,-50%);
  }
}

/* スマホ */
@media(max-width:600px){

  .opening{
    min-height:520px;
    background-position:center center;
  }

  .center{
    width:94%;
  }

  .logo-wrap{
    min-height:130px;
  }

  .logo-image{
    width:min(90vw,600px);
    max-width:600px;
  }

  .corner{
    font-size:.56rem;
  }

  .left{
    left:6%;
    top:5%;
  }

  .right{
    right:6%;
    top:5%;
  }

  .message{
    margin-top:32px;
    letter-spacing:.08em;
  }

  .enter{
    margin-top:28px;
  }

  .bottom{
    right:6%;
    bottom:4%;
    font-size:.55rem;
  }
}

/* アニメーションを減らす設定 */
@media(prefers-reduced-motion:reduce){

  .center{
    animation:none;
  }
}
</style>
</head>

<body>

<main class="opening">

  <div class="corner left">
    言葉にならない想いを、<br>
    一枚の作品に。
  </div>

  <div class="corner right">
    きっと、どこかで、<br>
    あなたの星が待っている。
  </div>

  <div class="center">

    <div class="logo-wrap">

      <img
        class="logo-image"
        src="logo.png"
        alt="星詠"
        onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block';"
      >

      <h1 class="logo" id="logoFallback">
        星詠
      </h1>

    </div>

    <div class="en">
      H O S H I Y O M I
    </div>

    <p class="message">
      無限に広がる夜空から、あなただけの星を。
    </p>

    <a
      class="enter"
      href="../index_星詠_紹介からプランへ版.html"
    >
      ENTER
    </a>

  </div>

  <div class="bottom">
    A STAR FOR YOU.
  </div>

</main>

</body>
</html>

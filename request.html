<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>依頼する｜星詠</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:#edf3ff;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(90,130,210,.12),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #040916 0%,
      #07142d 55%,
      #040916 100%
    );

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  line-height:1.9;
}

.wrap{
  width:min(900px,calc(100% - 40px));
  margin:auto;
}


/* =========================
   HEADER
========================= */

header{
  text-align:center;
  padding:100px 0 70px;
}

.system{
  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.75rem;

  letter-spacing:.3em;

  margin-bottom:25px;
}

.logo{
  width:min(220px,60vw);

  height:auto;

  display:block;

  margin:0 auto 28px;

  filter:
    drop-shadow(
      0 0 20px
      rgba(150,190,255,.18)
    );
}

h1{
  font-size:
    clamp(2rem,5vw,3rem);

  font-weight:400;

  letter-spacing:.12em;

  margin:0;
}

.lead{
  color:#aab8d2;

  margin:22px auto 0;
}


/* =========================
   MAIN
========================= */

section{
  padding:65px 0;

  border-top:
    1px solid
    rgba(180,205,245,.18);
}

.section-label{
  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.22em;

  margin:0 0 10px;

  text-align:center;
}

h2{
  font-size:1.6rem;

  font-weight:400;

  letter-spacing:.08em;

  margin:0 0 45px;

  text-align:center;
}


/* =========================
   CHOICE
========================= */

.choices{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:24px;
}

.choice{

  min-height:310px;

  padding:45px 30px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  text-decoration:none;

  color:#edf3ff;

  border:
    1px solid
    rgba(180,205,245,.2);

  border-radius:24px;

  background:
    rgba(10,24,52,.58);

  transition:
    .4s ease;
}

.choice:hover{

  transform:translateY(-6px);

  border-color:
    rgba(143,191,255,.55);

  background:
    rgba(20,40,78,.72);

  box-shadow:
    0 18px 50px
    rgba(50,90,170,.14);
}

.choice-number{

  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.25em;

  margin-bottom:22px;
}

.choice h3{

  font-size:1.45rem;

  font-weight:400;

  letter-spacing:.1em;

  margin:0 0 18px;
}

.choice p{

  color:#aab8d2;

  font-size:.9rem;

  margin:0;

  line-height:2;
}

.choice-arrow{

  margin-top:30px;

  color:#8fbfff;

  font-size:.9rem;

  letter-spacing:.12em;

  opacity:.8;
}


/* =========================
   FOOT NOTE
========================= */

.message{

  margin-top:45px;

  text-align:center;

  color:#8291aa;

  font-size:.82rem;

  line-height:2;
}


/* =========================
   BACK
========================= */

.back{

  display:block;

  width:max-content;

  margin:45px auto 80px;

  padding:10px 22px;

  border:
    1px solid
    rgba(180,205,245,.18);

  border-radius:999px;

  color:#dce8ff;

  text-decoration:none;

  transition:.3s ease;
}

.back:hover{

  background:
    rgba(180,210,255,.08);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .wrap{
    width:min(100% - 28px,900px);
  }

  header{
    padding:75px 0 50px;
  }

  section{
    padding:55px 0;
  }

  .choices{
    grid-template-columns:1fr;
  }

  .choice{
    min-height:240px;
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="wrap">

    <div class="system">
      HOSHIYOMI REQUEST SYSTEM
    </div>

    <img
      src="logo.png"
      alt="星詠"
      class="logo"
    >

    <h1>
      依頼する
    </h1>

    <p class="lead">
      あなたの星を、ここから届けてください。
    </p>

  </div>

</header>



<main class="wrap">


<section>

  <p class="section-label">
    REQUEST
  </p>

  <h2>
    どちらから始めますか？
  </h2>


  <div class="choices">


    <!-- 初回 -->

    <a
      href="first-order.html"
      class="choice"
    >

      <div class="choice-number">
        01
      </div>

      <h3>
        初回のみのご案内
      </h3>

      <p>
        はじめて星詠をご利用になる方へ。<br>
        あなたの姿を、ミニ色紙に。
      </p>

      <div class="choice-arrow">
        初回の依頼を見る　→
      </div>

    </a>



    <!-- 通常 -->

    <a
      href="request-normal.html"
      class="choice"
    >

      <div class="choice-number">
        02
      </div>

      <h3>
        通常のご依頼
      </h3>

      <p>
        あなたの姿、あなたの世界を<br>
        一枚の作品へ。
      </p>

      <div class="choice-arrow">
        通常の依頼を見る　→
      </div>

    </a>


  </div>


  <p class="message">

    はじめての方は「初回のみのご案内」から。<br>
    すでに星詠をご利用いただいた方は「通常のご依頼」へ。

  </p>

</section>


</main>



<a
  href="index.html"
  class="back"
>
  ← 星詠の入口へ戻る
</a>


</body>
</html>

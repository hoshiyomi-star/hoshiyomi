<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>依頼する｜星詠</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:#edf3ff;
  background:
    radial-gradient(circle at 50% 0%,rgba(90,130,210,.12),transparent 35%),
    linear-gradient(180deg,#040916 0%,#07142d 55%,#040916 100%);
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  line-height:1.9;
}

.wrap{
  width:min(1000px,calc(100% - 40px));
  margin:auto;
}

header{
  text-align:center;
  padding:100px 0 65px;
}

.system{
  color:#8fbfff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:.75rem;
  letter-spacing:.3em;
  margin-bottom:25px;
}

.logo{
  width:min(220px,60vw);
  height:auto;
  display:block;
  margin:0 auto 28px;
  filter:drop-shadow(0 0 20px rgba(150,190,255,.18));
}

h1{
  font-size:clamp(2rem,5vw,3rem);
  font-weight:400;
  letter-spacing:.12em;
  margin:0;
}

.lead{
  color:#aab8d2;
  margin:22px auto 0;
}

section{
  padding:60px 0;
  border-top:1px solid rgba(180,205,245,.18);
}

.section-label{
  color:#8fbfff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:.72rem;
  letter-spacing:.22em;
  margin:0 0 10px;
}

h2{
  font-size:1.6rem;
  font-weight:400;
  letter-spacing:.08em;
  margin:0 0 35px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  min-height:220px;
  padding:35px 28px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  text-decoration:none;
  color:#edf3ff;

  border:1px solid rgba(180,205,245,.18);
  border-radius:20px;

  background:rgba(10,24,52,.58);

  transition:.35s ease;
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(143,191,255,.55);
  background:rgba(20,40,78,.7);
  box-shadow:0 15px 40px rgba(50,90,170,.12);
}

.number{
  color:#8fbfff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:.75rem;
  letter-spacing:.2em;
  margin-bottom:18px;
}

.card h3{
  font-size:1.25rem;
  font-weight:400;
  letter-spacing:.08em;
  margin:0 0 12px;
}

.card p{
  color:#aab8d2;
  font-size:.9rem;
  margin:0;
}

.note{
  margin-top:30px;
  padding:20px 22px;
  border-left:2px solid rgba(143,191,255,.45);
  background:rgba(120,160,255,.035);
  color:#c8d4ea;
  font-size:.9rem;
}

.back{
  display:block;
  width:max-content;
  margin:45px auto 80px;
  padding:10px 22px;
  border:1px solid rgba(180,205,245,.18);
  border-radius:999px;
  color:#dce8ff;
  text-decoration:none;
  transition:.3s ease;
}

.back:hover{
  background:rgba(180,210,255,.08);
}

@media(max-width:700px){

  .wrap{
    width:min(100% - 28px,1000px);
  }

  header{
    padding:75px 0 50px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .card{
    min-height:180px;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap">

    <div class="system">
      HOSHIYOMI REQUEST SYSTEM
    </div>

    <img
      src="logo.png"
      alt="星詠"
      class="logo"
    >

    <h1>依頼する</h1>

    <p class="lead">
      あなたの星を、ここから届けてください。
    </p>

  </div>
</header>


<main class="wrap">

<section>

  <p class="section-label">
    01｜REQUEST
  </p>

  <h2>
    どのような依頼をしますか？
  </h2>

  <div class="cards">

    <a href="#" class="card">

      <div class="number">
        01
      </div>

      <h3>
        あなたの姿
      </h3>

      <p>
        あなた自身をもとにした作品を依頼する
      </p>

    </a>


    <a href="#" class="card">

      <div class="number">
        02
      </div>

      <h3>
        あなたの世界
      </h3>

      <p>
        あなたの世界観や物語をもとに依頼する
      </p>

    </a>

  </div>

</section>


<section>

  <p class="section-label">
    02｜FLOW
  </p>

  <h2>
    ご依頼の流れ
  </h2>

  <div class="note">

    内容を選択したあと、必要な情報をお伺いします。<br>
    詳細を確認しながら、あなたの依頼に合わせて制作内容を決定します。

  </div>

</section>


<section>

  <p class="section-label">
    03｜NOTE
  </p>

  <h2>
    ご依頼の前に
  </h2>

  <div class="note">

    制作内容・料金・納期・利用範囲などについては、
    ご依頼前に必ずご確認ください。

  </div>

</section>

</main>


<a href="index.html" class="back">
  ← 星詠の入口へ戻る
</a>

</body>
</html>

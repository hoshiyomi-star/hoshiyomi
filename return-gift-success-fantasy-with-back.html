<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星詠｜返礼品の星</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  overflow-x:hidden;
  color:#edf3ff;
  font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;
  background:
    radial-gradient(ellipse at 50% 38%,rgba(65,100,175,.12),transparent 48%),
    linear-gradient(180deg,#020611 0%,#07152d 55%,#030817 100%);
}

/* 静かな星空 */
.sky{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.sky::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.28;
  background-image:
    radial-gradient(circle at 14% 17%,rgba(235,243,255,.9) 0 1px,transparent 1.8px),
    radial-gradient(circle at 83% 26%,rgba(205,225,255,.65) 0 1px,transparent 1.8px),
    radial-gradient(circle at 73% 67%,rgba(225,238,255,.65) 0 1px,transparent 1.8px),
    radial-gradient(circle at 24% 72%,rgba(195,220,255,.5) 0 1px,transparent 1.8px);
}
.nebula{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 78% 30%,rgba(80,105,180,.13),transparent 34%),
    radial-gradient(ellipse at 20% 63%,rgba(70,100,175,.10),transparent 35%);
  filter:blur(18px);
}

/* ごく少数の流星 */
.meteor{
  position:absolute;
  top:-90px;
  width:1px;
  height:55px;
  opacity:0;
  border-radius:999px;
  background:linear-gradient(to bottom,transparent,rgba(225,237,255,.78),#fff);
  box-shadow:0 0 7px rgba(175,205,255,.38);
  transform:rotate(var(--angle));
  animation:meteor var(--time) linear var(--delay) infinite;
}
@keyframes meteor{
  0%,12%{opacity:0;transform:translate(0,0) rotate(var(--angle))}
  18%{opacity:.42}
  72%{opacity:.42}
  100%{opacity:0;transform:translate(var(--drift),115vh) rotate(var(--angle))}
}

.page{
  position:relative;
  z-index:2;
  width:min(760px,calc(100% - 36px));
  margin:auto;
  padding:78px 20px 55px;
  text-align:center;
}

.emblem{
  width:52px;height:52px;
  margin:0 auto 38px;
  border:1px solid rgba(190,215,255,.38);
  border-radius:50%;
  position:relative;
  opacity:.82;
}
.emblem::before,.emblem::after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  background:rgba(215,230,255,.58);
  transform:translate(-50%,-50%);
}
.emblem::before{width:70px;height:1px}
.emblem::after{width:1px;height:70px}
.emblem span{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:19px;
}

h1{
  margin:0 0 32px;
  font-size:clamp(23px,4vw,35px);
  font-weight:400;
  letter-spacing:.08em;
  line-height:1.9;
  text-shadow:0 0 18px rgba(150,190,255,.10);
}
.lead{
  margin:0 0 36px;
  font-size:15px;
  line-height:2.15;
  letter-spacing:.08em;
}

.notice{
  max-width:650px;
  margin:0 auto 42px;
  padding:29px 26px;
  border:1px solid rgba(180,205,245,.22);
  border-radius:12px;
  background:rgba(5,17,43,.38);
  backdrop-filter:blur(5px);
  font-size:14px;
  line-height:2.05;
  letter-spacing:.04em;
}
.notice strong{
  display:block;
  margin-bottom:14px;
  font-weight:500;
}
.divider{
  width:120px;
  height:1px;
  margin:22px auto;
  background:linear-gradient(90deg,transparent,rgba(220,235,255,.58),transparent);
  position:relative;
}
.divider::after{
  content:"✦";
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-54%);
  padding:0 8px;
  background:#07152d;
  color:#e8f1ff;
  font-size:14px;
}

.final{
  margin:0 0 30px;
  font-size:16px;
  letter-spacing:.10em;
  line-height:2;
}

.return{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  min-width:245px;
  padding:14px 28px;
  color:#e9f2ff;
  text-decoration:none;
  border:1px solid rgba(195,220,255,.42);
  border-radius:999px;
  background:rgba(8,20,48,.35);
  box-shadow:0 0 20px rgba(120,170,245,.06);
  font-size:14px;
  letter-spacing:.12em;
  transition:.3s ease;
}
.return:hover{
  background:rgba(80,110,180,.15);
  border-color:rgba(220,235,255,.68);
  box-shadow:0 0 26px rgba(130,180,255,.13);
  transform:translateY(-2px);
}
.return::before{content:"✦";font-size:16px}

.brand{
  margin-top:40px;
  font-size:11px;
  letter-spacing:.20em;
  opacity:.48;
}

.sea{
  position:fixed;
  z-index:0;
  left:0;right:0;bottom:0;
  height:22vh;
  pointer-events:none;
  background:
    linear-gradient(180deg,transparent,rgba(3,12,30,.25) 28%,rgba(2,8,21,.92)),
    repeating-linear-gradient(
      178deg,
      transparent 0 11px,
      rgba(180,210,255,.035) 12px 13px,
      transparent 14px 25px
    );
}
.sea::after{
  content:"";
  position:absolute;
  left:50%;top:18%;
  width:40%;
  height:35%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(190,220,255,.13),transparent 70%);
  filter:blur(8px);
}

@media(max-width:600px){
  .page{padding:58px 10px 42px}
  h1{font-size:23px;line-height:1.85}
  .lead,.final{font-size:14px}
  .notice{padding:22px 17px;font-size:13px}
  .return{min-width:225px}
}
</style>
</head>

<body>
<div class="sky">
  <div class="nebula"></div>
  <span class="meteor" style="left:18%;--time:15s;--delay:-4s;--drift:28px;--angle:3deg"></span>
  <span class="meteor" style="left:79%;--time:19s;--delay:-11s;--drift:-35px;--angle:-4deg"></span>
</div>

<div class="sea"></div>

<main class="page">
  <div class="emblem"><span>✦</span></div>

  <h1>
    あなたの大切な想いから生まれる、<br>
    返礼品の星の願い。<br>
    受け取りました。
  </h1>

  <p class="lead">
    あなたから届いた、<br>
    誰かを想う気持ちをお預かりします。
  </p>

  <section class="notice">
    <strong>この時点では、ご依頼の確定ではありません。</strong>

    ご依頼内容や納期、制作について確認が必要な場合は、<br>
    ご入力いただいたメールアドレスへご連絡いたします。

    <div class="divider"></div>

    内容を確認したうえで、<br>
    後日正式な料金・納期などをご案内します。
  </section>

  <p class="final">
    あなたの星が、誰かのもとへ届きますように。
  </p>

  <a class="return" href="index.html">星の海へ戻る →</a>

  <div class="brand">― 星詠｜HOSHIYOMI ―</div>
</main>

<script>
/* 画面には2本だけ、かなり低頻度で流星が現れます */
</script>
</body>
</html>

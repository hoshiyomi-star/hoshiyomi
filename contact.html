<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お問い合わせ｜星詠</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

      color: #dcecff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(65, 105, 180, 0.18),
          transparent 45%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(70, 80, 180, 0.08),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #071225 0%,
          #050b18 55%,
          #030711 100%
        );

      background-attachment: fixed;
    }


    /* =========================
       ページ全体
    ========================== */

    .contact-page {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 70px 0 110px;
    }


    /* =========================
       上部ナビゲーション
    ========================== */

    .page-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;

      margin-bottom: 65px;
    }

    .page-nav a {
      display: inline-block;

      padding: 9px 18px;

      color: rgba(205, 230, 255, 0.72);

      text-decoration: none;

      font-size: 0.82rem;
      letter-spacing: 0.08em;

      background:
        rgba(20, 45, 85, 0.38);

      border:
        1px solid rgba(150, 205, 255, 0.18);

      border-radius: 999px;

      transition:
        color 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .page-nav a:hover {
      color: #eaf7ff;

      background:
        rgba(55, 110, 180, 0.28);

      border-color:
        rgba(160, 220, 255, 0.55);

      box-shadow:
        0 0 18px rgba(100, 180, 255, 0.18);

      transform: translateY(-1px);
    }


    /* =========================
       タイトル
    ========================== */

    .title-area {
      text-align: center;

      margin-bottom: 55px;
    }

    .title-label {
      margin-bottom: 14px;

      color:
        rgba(160, 205, 255, 0.55);

      font-size: 0.72rem;

      letter-spacing: 0.3em;
    }

    h1 {
      margin: 0;

      color: #e5f3ff;

      font-size:
        clamp(2rem, 5vw, 3rem);

      font-weight: 400;

      letter-spacing: 0.14em;

      text-shadow:
        0 0 18px rgba(110, 180, 255, 0.18);
    }

    .title-description {
      margin-top: 26px;

      color:
        rgba(205, 225, 245, 0.72);

      line-height: 2.1;

      font-size: 0.9rem;

      letter-spacing: 0.04em;
    }


    /* =========================
       フォーム
    ========================== */

    .contact-form {
      position: relative;

      padding:
        clamp(26px, 5vw, 50px);

      background:
        rgba(8, 20, 42, 0.68);

      border:
        1px solid rgba(145, 200, 255, 0.16);

      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(0, 15, 50, 0.3),
        inset 0 0 35px rgba(90, 150, 230, 0.025);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* 上部の小さな星 */

    .contact-form::before {
      content: "✦";

      position: absolute;

      top: 18px;
      right: 24px;

      color:
        rgba(190, 225, 255, 0.45);

      font-size: 0.75rem;

      text-shadow:
        0 0 12px rgba(150, 210, 255, 0.4);
    }


    /* =========================
       フォーム項目
    ========================== */

    .form-section {
      margin-bottom: 10px;
    }

    label {
      display: block;

      margin-bottom: 28px;

      color: #dcecff;

      font-size: 0.9rem;

      line-height: 1.7;

      letter-spacing: 0.03em;
    }

    .required {
      margin-left: 7px;

      color:
        rgba(150, 205, 255, 0.65);

      font-size: 0.68rem;

      letter-spacing: 0.05em;
    }


    /* =========================
       入力欄
    ========================== */

    input,
    select,
    textarea {
      display: block;

      width: 100%;

      margin-top: 10px;

      padding: 14px 15px;

      color: #e5f3ff;

      font-family: inherit;

      font-size: 0.9rem;

      letter-spacing: 0.02em;

      background:
        rgba(3, 12, 28, 0.72);

      border:
        1px solid rgba(145, 200, 255, 0.18);

      border-radius: 10px;

      outline: none;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color:
        rgba(185, 210, 235, 0.36);
    }

    input:focus,
    select:focus,
    textarea:focus {
      background:
        rgba(5, 17, 38, 0.82);

      border-color:
        rgba(145, 210, 255, 0.55);

      box-shadow:
        0 0 15px rgba(100, 180, 255, 0.1);
    }

    select {
      cursor: pointer;
    }

    textarea {
      min-height: 180px;

      resize: vertical;

      line-height: 1.8;
    }


    /* =========================
       入力欄の選択肢
    ========================== */

    option {
      color: #dcecff;

      background: #071225;
    }


    /* =========================
       送信前メッセージ
    ========================== */

    .contact-message {
      margin:
        38px 0 32px;

      padding-top: 26px;

      text-align: center;

      color:
        rgba(205, 225, 245, 0.62);

      font-size: 0.82rem;

      line-height: 2;

      letter-spacing: 0.04em;

      border-top:
        1px solid rgba(145, 200, 255, 0.1);
    }


    /* =========================
       送信ボタン
    ========================== */

    .submit-area {
      text-align: center;
    }

    .submit-button {
      min-width: 190px;

      padding: 14px 30px;

      color: #eaf7ff;

      font-family: inherit;

      font-size: 0.9rem;

      letter-spacing: 0.12em;

      background:
        rgba(45, 100, 170, 0.45);

      border:
        1px solid rgba(155, 215, 255, 0.35);

      border-radius: 999px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .submit-button:hover {
      background:
        rgba(70, 140, 220, 0.55);

      border-color:
        rgba(180, 230, 255, 0.7);

      box-shadow:
        0 0 22px rgba(100, 190, 255, 0.2);

      transform: translateY(-2px);
    }

    .submit-button:active {
      transform: translateY(0);
    }


    /* =========================
       ページ下部
    ========================== */

    .page-footer {
      margin-top: 55px;

      text-align: center;

      color:
        rgba(160, 195, 225, 0.42);

      font-size: 0.72rem;

      line-height: 2;

      letter-spacing: 0.12em;
    }


    /* =========================
       スマートフォン
    ========================== */

    @media (max-width: 600px) {

      .contact-page {
        width:
          calc(100% - 20px);

        padding:
          40px 0 80px;
      }

      .page-nav {
        margin-bottom: 45px;

        gap: 8px;
      }

      .page-nav a {
        padding:
          8px 12px;

        font-size: 0.72rem;
      }

      .title-area {
        margin-bottom: 40px;
      }

      .title-description {
        font-size: 0.82rem;

        line-height: 2;
      }

      .contact-form {
        padding:
          28px 18px;
      }

      label {
        font-size: 0.85rem;

        margin-bottom: 25px;
      }

      input,
      select,
      textarea {
        font-size: 0.85rem;

        padding:
          13px 12px;
      }

      textarea {
        min-height: 160px;
      }

      .contact-message {
        font-size: 0.76rem;
      }

      .submit-button {
        width: 100%;

        max-width: 260px;
      }

      .page-footer {
        margin-top: 40px;
      }

    }

  </style>

<style id="hoshiyomi-contact-night-design">
  /* 星詠｜お問い合わせ：星のかけらと同じ夜空 */
  html, body {
    min-height: 100%;
  }

  body {
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(132,163,235,.17), transparent 38%),
      radial-gradient(circle at 12% 34%, rgba(85,121,205,.09), transparent 24%),
      radial-gradient(circle at 88% 62%, rgba(75,108,190,.08), transparent 26%),
      linear-gradient(180deg, #020612 0%, #06132b 52%, #02050d 100%) !important;
    color: #edf4ff !important;
    letter-spacing: .025em;
  }

  /* 月明かり */
  body::before {
    content: "";
    position: fixed;
    width: 34vw;
    height: 34vw;
    min-width: 220px;
    min-height: 220px;
    max-width: 480px;
    max-height: 480px;
    top: -13vw;
    right: -9vw;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(
      circle,
      rgba(205,222,255,.16) 0%,
      rgba(145,180,245,.08) 28%,
      rgba(100,135,210,.025) 50%,
      transparent 72%
    );
    filter: blur(3px);
  }

  /* 遠い星 */
  body::after {
    content:
      "·   ✦      ·       ˚     ·  ✧        ·"
      "       ˚       ·      ✦       ·       ˚"
      "   ·       ✧       ·       ˚      ✦   ";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    color: rgba(218,231,255,.42);
    font-size: 12px;
    line-height: 5.2;
    letter-spacing: 1.15em;
    white-space: pre-wrap;
    opacity: .55;
    transform: rotate(-4deg) scale(1.08);
  }

  .contact-container,
  .contact-form {
    position: relative;
    z-index: 1;
  }

  .contact-container {
    color: #edf4ff !important;
  }

  .contact-form {
    border: 1px solid rgba(185,213,255,.16) !important;
    border-radius: 24px !important;
    background:
      radial-gradient(circle at 50% 0%, rgba(155,190,250,.09), transparent 42%),
      rgba(5,14,31,.78) !important;
    box-shadow:
      0 18px 60px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.025) !important;
    overflow: hidden;
  }

  .contact-form h1 {
    color: #edf5ff !important;
    font-weight: 500 !important;
    letter-spacing: .14em;
    text-shadow: 0 0 22px rgba(164,198,255,.18);
  }

  .contact-form h1::before {
    content: "✦";
    margin-right: .65em;
    color: rgba(190,220,255,.72);
    font-size: .55em;
    vertical-align: middle;
    text-shadow: 0 0 14px rgba(180,215,255,.8);
  }

  .contact-form h1::after {
    content: "✦";
    margin-left: .65em;
    color: rgba(190,220,255,.42);
    font-size: .5em;
    vertical-align: middle;
  }

  .form-section {
    border-color: rgba(175,204,245,.11) !important;
    background: rgba(10,24,48,.48) !important;
  }

  .form-section h2,
  .form-section h3 {
    color: #dce7f8 !important;
    font-weight: 500 !important;
    letter-spacing: .09em;
  }

  .form-section h2::before,
  .form-section h3::before {
    content: "✧";
    margin-right: .5em;
    color: rgba(190,216,255,.62);
    font-size: .7em;
    text-shadow: 0 0 10px rgba(170,205,255,.55);
  }

  label {
    color: #dce7f8 !important;
    font-weight: 500;
    line-height: 2;
  }

  label::before {
    content: "✦";
    margin-right: .5em;
    color: rgba(174,205,250,.52);
    font-size: .72em;
    text-shadow: 0 0 9px rgba(170,205,255,.45);
  }

  input,
  textarea,
  select {
    border: 1px solid rgba(177,205,246,.16) !important;
    border-radius: 12px !important;
    background:
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018)),
      rgba(3,10,24,.58) !important;
    color: #edf4ff !important;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.025),
      0 7px 24px rgba(0,0,0,.12) !important;
    letter-spacing: .02em;
  }

  input::placeholder,
  textarea::placeholder,
  select {
    color: rgba(192,207,232,.48) !important;
  }

  input:hover,
  textarea:hover,
  select:hover {
    border-color: rgba(177,205,246,.27) !important;
  }

  input:focus,
  textarea:focus,
  select:focus {
    outline: none !important;
    border-color: rgba(184,214,255,.48) !important;
    box-shadow:
      0 0 0 3px rgba(125,170,238,.055),
      0 0 22px rgba(125,170,238,.09),
      inset 0 1px 0 rgba(255,255,255,.035) !important;
  }

  textarea {
    line-height: 2;
  }

  .required {
    color: #a9c9f7 !important;
    opacity: .78;
  }

  /* 送信前メッセージ */
  .contact-note,
  .form-note,
  .notice {
    color: rgba(200,214,236,.74) !important;
    line-height: 2;
  }

  /* 送信ボタン */
  .contact-form button[type="submit"],
  .submit-button,
  .contact-submit {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(190,218,255,.24) !important;
    border-radius: 999px !important;
    color: #eef5ff !important;
    background:
      radial-gradient(circle at 50% 0%, rgba(180,215,255,.13), transparent 60%),
      linear-gradient(180deg, rgba(93,135,205,.18), rgba(47,79,135,.16)) !important;
    box-shadow:
      0 8px 30px rgba(0,0,0,.22),
      0 0 24px rgba(120,170,245,.055) !important;
    letter-spacing: .08em;
    font-weight: 500;
    transition: transform .22s ease, border-color .22s ease,
                box-shadow .22s ease, background .22s ease;
  }

  .contact-form button[type="submit"]::before,
  .submit-button::before,
  .contact-submit::before {
    content: "✦";
    display: inline-block;
    margin-right: .7em;
    color: rgba(215,232,255,.88);
    text-shadow: 0 0 12px rgba(185,220,255,.8);
  }

  .contact-form button[type="submit"]:hover,
  .submit-button:hover,
  .contact-submit:hover {
    transform: translateY(-2px);
    border-color: rgba(202,225,255,.38) !important;
    box-shadow:
      0 10px 34px rgba(0,0,0,.25),
      0 0 30px rgba(130,180,255,.11) !important;
  }

  /* 最後の一言 */
  .contact-form::after {
    content: "あなたは、あなたのままで輝く星です。";
    display: block;
    margin: 6px auto 28px;
    padding: 0 20px;
    text-align: center;
    color: rgba(210,228,255,.58);
    font-size: 13px;
    letter-spacing: .08em;
    line-height: 2;
  }

  @media (max-width: 700px) {
    body::before {
      width: 280px;
      height: 280px;
      top: -90px;
      right: -100px;
    }

    body::after {
      font-size: 9px;
      line-height: 6.4;
      letter-spacing: .65em;
    }
  }

  @media (max-width: 560px) {
    .contact-form {
      border-radius: 18px !important;
    }

    input,
    textarea,
    select {
      border-radius: 10px !important;
    }
  }
</style>

</head>


<body>

  <main class="contact-page">


    <!-- =========================
         ページ移動
    ========================== -->

    <nav class="page-nav">

      <a href="index.html">
        ✦ 星詠
      </a>

      <a href="star-sheet.html">
        ✦ 星のかけら
      </a>

      <a href="contact.html">
        ✦ お問い合わせ
      </a>

    </nav>


    <!-- =========================
         タイトル
    ========================== -->

    <header class="title-area">

      <div class="title-label">
        CONTACT
      </div>

      <h1>お問い合わせ</h1>

      <div class="title-description">

        星の海を訪れてくださり、ありがとうございます。<br>
        ご質問やご相談、ご依頼についてなど、<br>
        どうぞお気軽にお声がけください。

      </div>

    </header>


    <!-- =========================
         問い合わせフォーム
    ========================== -->

    <form
      class="contact-form"
      action="https://formsubmit.co/hoshi.sengetu@gmail.com"
      method="POST"
      accept-charset="UTF-8"
    >

      <!-- FormSubmit設定 -->

      <input
        type="hidden"
        name="_subject"
        value="【星詠】お問い合わせが届きました"
      >

       <input
        type="hidden"
        name="_next"
        value="http://127.0.0.1:5500/thanks.html"
    >

      <input
        type="hidden"
        name="_captcha"
        value="false"
      >


      <div class="form-section">


        <!-- =========================
             お名前
        ========================== -->

        <label>

          お名前・呼ばれたい名前
          <span class="required">必須</span>

          <input
            type="text"
            name="お名前"
            placeholder="お名前や呼ばれたい名前"
            required
          >

        </label>


        <!-- =========================
             メールアドレス
        ========================== -->

        <label>

          メールアドレス
          <span class="required">必須</span>

          <input
            type="email"
            name="メールアドレス"
            placeholder="example@example.com"
            required
          >

        </label>


        <!-- =========================
             お問い合わせの種類
        ========================== -->

        <label>

          お問い合わせの種類
          <span class="required">必須</span>

          <select
            name="お問い合わせの種類"
            required
          >

            <option
              value=""
              selected
              disabled
            >
              星の海から選択してください
            </option>

            <option value="ご依頼について">
              ご依頼について
            </option>

            <option value="サービスについて">
              サービスについて
            </option>

            <option value="サイトについて">
              サイトについて
            </option>

            <option value="料金について">
              料金について
            </option>

            <option value="利用規約・権利について">
              利用規約・権利について
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </label>


        <!-- =========================
             件名
        ========================== -->

        <label>

          件名
          <span class="required">必須</span>

          <input
            type="text"
            name="件名"
            placeholder="お問い合わせの件名"
            required
          >

        </label>


        <!-- =========================
             お問い合わせ内容
        ========================== -->

        <label>

          お問い合わせ内容
          <span class="required">必須</span>

          <textarea
            name="お問い合わせ内容"
            placeholder="お問い合わせ内容をご記入ください。"
            required
          ></textarea>

        </label>


        <!-- =========================
             その他
        ========================== -->

        <label>

          その他、伝えておきたいこと

          <textarea
            name="その他、伝えておきたいこと"
            placeholder="必要があれば、自由にお書きください。"
          ></textarea>

        </label>


      </div>


      <!-- =========================
           送信前メッセージ
      ========================== -->

      <div class="contact-message">

        お預かりした言葉は、星詠にて大切に拝見いたします。<br>
        内容を確認のうえ、順次ご返信いたします。

      </div>


      <!-- =========================
           送信ボタン
      ========================== -->

      <div class="submit-area">

        <button
          type="submit"
          class="submit-button"
        >
          ✦ 星へ届ける
        </button>

      </div>


    </form>


    <!-- =========================
         フッター
    ========================== -->

    <div class="page-footer">

      星の海から、あなたの言葉を。

    </div>


  </main>

</body>

</html>

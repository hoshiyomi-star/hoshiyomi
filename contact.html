<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お問い合わせ｜星詠</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

      color: #dcecff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(65, 105, 180, 0.18),
          transparent 45%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(70, 80, 180, 0.08),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #071225 0%,
          #050b18 55%,
          #030711 100%
        );

      background-attachment: fixed;
    }


    /* =========================
       ページ全体
    ========================== */

    .contact-page {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 70px 0 110px;
    }


    /* =========================
       上部ナビゲーション
    ========================== */

    .page-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;

      margin-bottom: 65px;
    }

    .page-nav a {
      display: inline-block;

      padding: 9px 18px;

      color: rgba(205, 230, 255, 0.72);

      text-decoration: none;

      font-size: 0.82rem;
      letter-spacing: 0.08em;

      background:
        rgba(20, 45, 85, 0.38);

      border:
        1px solid rgba(150, 205, 255, 0.18);

      border-radius: 999px;

      transition:
        color 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .page-nav a:hover {
      color: #eaf7ff;

      background:
        rgba(55, 110, 180, 0.28);

      border-color:
        rgba(160, 220, 255, 0.55);

      box-shadow:
        0 0 18px rgba(100, 180, 255, 0.18);

      transform: translateY(-1px);
    }


    /* =========================
       タイトル
    ========================== */

    .title-area {
      text-align: center;

      margin-bottom: 55px;
    }

    .title-label {
      margin-bottom: 14px;

      color:
        rgba(160, 205, 255, 0.55);

      font-size: 0.72rem;

      letter-spacing: 0.3em;
    }

    h1 {
      margin: 0;

      color: #e5f3ff;

      font-size:
        clamp(2rem, 5vw, 3rem);

      font-weight: 400;

      letter-spacing: 0.14em;

      text-shadow:
        0 0 18px rgba(110, 180, 255, 0.18);
    }

    .title-description {
      margin-top: 26px;

      color:
        rgba(205, 225, 245, 0.72);

      line-height: 2.1;

      font-size: 0.9rem;

      letter-spacing: 0.04em;
    }


    /* =========================
       フォーム
    ========================== */

    .contact-form {
      position: relative;

      padding:
        clamp(26px, 5vw, 50px);

      background:
        rgba(8, 20, 42, 0.68);

      border:
        1px solid rgba(145, 200, 255, 0.16);

      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(0, 15, 50, 0.3),
        inset 0 0 35px rgba(90, 150, 230, 0.025);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* 上部の小さな星 */

    .contact-form::before {
      content: "✦";

      position: absolute;

      top: 18px;
      right: 24px;

      color:
        rgba(190, 225, 255, 0.45);

      font-size: 0.75rem;

      text-shadow:
        0 0 12px rgba(150, 210, 255, 0.4);
    }


    /* =========================
       フォーム項目
    ========================== */

    .form-section {
      margin-bottom: 10px;
    }

    label {
      display: block;

      margin-bottom: 28px;

      color: #dcecff;

      font-size: 0.9rem;

      line-height: 1.7;

      letter-spacing: 0.03em;
    }

    .required {
      margin-left: 7px;

      color:
        rgba(150, 205, 255, 0.65);

      font-size: 0.68rem;

      letter-spacing: 0.05em;
    }


    /* =========================
       入力欄
    ========================== */

    input,
    select,
    textarea {
      display: block;

      width: 100%;

      margin-top: 10px;

      padding: 14px 15px;

      color: #e5f3ff;

      font-family: inherit;

      font-size: 0.9rem;

      letter-spacing: 0.02em;

      background:
        rgba(3, 12, 28, 0.72);

      border:
        1px solid rgba(145, 200, 255, 0.18);

      border-radius: 10px;

      outline: none;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color:
        rgba(185, 210, 235, 0.36);
    }

    input:focus,
    select:focus,
    textarea:focus {
      background:
        rgba(5, 17, 38, 0.82);

      border-color:
        rgba(145, 210, 255, 0.55);

      box-shadow:
        0 0 15px rgba(100, 180, 255, 0.1);
    }

    select {
      cursor: pointer;
    }

    textarea {
      min-height: 180px;

      resize: vertical;

      line-height: 1.8;
    }


    /* =========================
       入力欄の選択肢
    ========================== */

    option {
      color: #dcecff;

      background: #071225;
    }


    /* =========================
       送信前メッセージ
    ========================== */

    .contact-message {
      margin:
        38px 0 32px;

      padding-top: 26px;

      text-align: center;

      color:
        rgba(205, 225, 245, 0.62);

      font-size: 0.82rem;

      line-height: 2;

      letter-spacing: 0.04em;

      border-top:
        1px solid rgba(145, 200, 255, 0.1);
    }


    /* =========================
       送信ボタン
    ========================== */

    .submit-area {
      text-align: center;
    }

    .submit-button {
      min-width: 190px;

      padding: 14px 30px;

      color: #eaf7ff;

      font-family: inherit;

      font-size: 0.9rem;

      letter-spacing: 0.12em;

      background:
        rgba(45, 100, 170, 0.45);

      border:
        1px solid rgba(155, 215, 255, 0.35);

      border-radius: 999px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .submit-button:hover {
      background:
        rgba(70, 140, 220, 0.55);

      border-color:
        rgba(180, 230, 255, 0.7);

      box-shadow:
        0 0 22px rgba(100, 190, 255, 0.2);

      transform: translateY(-2px);
    }

    .submit-button:active {
      transform: translateY(0);
    }


    /* =========================
       ページ下部
    ========================== */

    .page-footer {
      margin-top: 55px;

      text-align: center;

      color:
        rgba(160, 195, 225, 0.42);

      font-size: 0.72rem;

      line-height: 2;

      letter-spacing: 0.12em;
    }


    /* =========================
       スマートフォン
    ========================== */

    @media (max-width: 600px) {

      .contact-page {
        width:
          calc(100% - 20px);

        padding:
          40px 0 80px;
      }

      .page-nav {
        margin-bottom: 45px;

        gap: 8px;
      }

      .page-nav a {
        padding:
          8px 12px;

        font-size: 0.72rem;
      }

      .title-area {
        margin-bottom: 40px;
      }

      .title-description {
        font-size: 0.82rem;

        line-height: 2;
      }

      .contact-form {
        padding:
          28px 18px;
      }

      label {
        font-size: 0.85rem;

        margin-bottom: 25px;
      }

      input,
      select,
      textarea {
        font-size: 0.85rem;

        padding:
          13px 12px;
      }

      textarea {
        min-height: 160px;
      }

      .contact-message {
        font-size: 0.76rem;
      }

      .submit-button {
        width: 100%;

        max-width: 260px;
      }

      .page-footer {
        margin-top: 40px;
      }

    }

  </style>
</head>


<body>

  <main class="contact-page">


    <!-- =========================
         ページ移動
    ========================== -->

    <nav class="page-nav">

      <a href="index.html">
        ✦ 星詠
      </a>

      <a href="star-sheet.html">
        ✦ 星のかけら
      </a>

      <a href="contact.html">
        ✦ お問い合わせ
      </a>

    </nav>


    <!-- =========================
         タイトル
    ========================== -->

    <header class="title-area">

      <div class="title-label">
        CONTACT
      </div>

      <h1>お問い合わせ</h1>

      <div class="title-description">

        星の海を訪れてくださり、ありがとうございます。<br>
        ご質問やご相談、ご依頼についてなど、<br>
        どうぞお気軽にお声がけください。

      </div>

    </header>


    <!-- =========================
         問い合わせフォーム
    ========================== -->

    <form
      class="contact-form"
      action="https://formsubmit.co/hoshi.sengetu@gmail.com"
      method="POST"
      accept-charset="UTF-8"
    >

      <!-- FormSubmit設定 -->

      <input
        type="hidden"
        name="_subject"
        value="【星詠】お問い合わせが届きました"
      >

       <input
        type="hidden"
        name="_next"
        value="http://127.0.0.1:5500/thanks.html"
    >

      <input
        type="hidden"
        name="_captcha"
        value="false"
      >


      <div class="form-section">


        <!-- =========================
             お名前
        ========================== -->

        <label>

          お名前・呼ばれたい名前
          <span class="required">必須</span>

          <input
            type="text"
            name="お名前"
            placeholder="お名前や呼ばれたい名前"
            required
          >

        </label>


        <!-- =========================
             メールアドレス
        ========================== -->

        <label>

          メールアドレス
          <span class="required">必須</span>

          <input
            type="email"
            name="メールアドレス"
            placeholder="example@example.com"
            required
          >

        </label>


        <!-- =========================
             お問い合わせの種類
        ========================== -->

        <label>

          お問い合わせの種類
          <span class="required">必須</span>

          <select
            name="お問い合わせの種類"
            required
          >

            <option
              value=""
              selected
              disabled
            >
              星の海から選択してください
            </option>

            <option value="ご依頼について">
              ご依頼について
            </option>

            <option value="サービスについて">
              サービスについて
            </option>

            <option value="サイトについて">
              サイトについて
            </option>

            <option value="料金について">
              料金について
            </option>

            <option value="利用規約・権利について">
              利用規約・権利について
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </label>


        <!-- =========================
             件名
        ========================== -->

        <label>

          件名
          <span class="required">必須</span>

          <input
            type="text"
            name="件名"
            placeholder="お問い合わせの件名"
            required
          >

        </label>


        <!-- =========================
             お問い合わせ内容
        ========================== -->

        <label>

          お問い合わせ内容
          <span class="required">必須</span>

          <textarea
            name="お問い合わせ内容"
            placeholder="お問い合わせ内容をご記入ください。"
            required
          ></textarea>

        </label>


        <!-- =========================
             その他
        ========================== -->

        <label>

          その他、伝えておきたいこと

          <textarea
            name="その他、伝えておきたいこと"
            placeholder="必要があれば、自由にお書きください。"
          ></textarea>

        </label>


      </div>


      <!-- =========================
           送信前メッセージ
      ========================== -->

      <div class="contact-message">

        お預かりした言葉は、星詠にて大切に拝見いたします。<br>
        内容を確認のうえ、順次ご返信いたします。

      </div>


      <!-- =========================
           送信ボタン
      ========================== -->

      <div class="submit-area">

        <button
          type="submit"
          class="submit-button"
        >
          ✦ 星へ届ける
        </button>

      </div>


    </form>


    <!-- =========================
         フッター
    ========================== -->

    <div class="page-footer">

      星の海から、あなたの言葉を。

    </div>


  </main>

</body>

</html>

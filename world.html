<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>あなたの世界｜星詠 HOSHIYOMI</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root{
      --ys-bg:#040916;
      --ys-deep:#081936;
      --ys-blue:#8fbfff;
      --ys-violet:#a992d2;
      --ys-text:#edf3ff;
      --ys-muted:rgba(237,243,255,.72);
      --ys-line:rgba(180,205,255,.15);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:
        radial-gradient(
          circle at 50% 8%,
          rgba(76,104,165,.14),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #040916 0%,
          #061127 48%,
          #040916 100%
        );
      color:var(--ys-text);
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      line-height:2;
    }

    a{
      color:inherit;
    }

    .your-page{
      width:100%;
      min-height:100vh;
      padding:0 0 120px;
      position:relative;
      z-index:1;
    }

    /* =========================
       HERO
    ========================= */

    .your-hero{
      width:min(920px,calc(100% - 48px));
      margin:0 auto;
      padding:150px 0 100px;
      text-align:center;
    }

    .your-label{
      margin:0 0 18px;
      font-size:.82rem;
      letter-spacing:.2em;
      opacity:.62;
    }

    .your-hero h1{
      margin:0;
      font-size:clamp(2.2rem,5vw,3.5rem);
      font-weight:400;
      letter-spacing:.12em;
      line-height:1.45;
    }

    .your-hero .hero-sub{
      margin:26px 0 0;
      font-size:1.05rem;
      line-height:2.1;
      color:var(--ys-muted);
    }

    .your-price{
      margin:34px 0 0;
      font-size:1.15rem;
      letter-spacing:.1em;
    }

    /* =========================
       SECTION
    ========================= */

    .your-section{
      width:min(900px,calc(100% - 48px));
      margin:0 auto;
      padding:74px 0;
      border-top:1px solid var(--ys-line);
    }

    .your-section-label{
      margin:0 0 12px;
      font-size:.76rem;
      letter-spacing:.18em;
      opacity:.55;
    }

    .your-section h2{
      margin:0;
      font-size:1.7rem;
      font-weight:400;
      letter-spacing:.1em;
      line-height:1.6;
    }

    .your-lead{
      margin:24px 0 0;
      font-size:1rem;
      line-height:2.15;
      color:var(--ys-muted);
    }

    /* =========================
       INTRO
    ========================= */

    .your-intro{
      text-align:center;
      border-top:0;
      padding-top:0;
    }

    .your-intro p{
      margin:0;
      font-size:1.05rem;
      line-height:2.25;
      color:var(--ys-muted);
    }

    /* =========================
       CARDS
    ========================= */

    .your-cards{
      margin-top:42px;
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      gap:20px;
    }

    .your-card{
      padding:32px 30px;
      border:1px solid var(--ys-line);
      background:rgba(7,16,36,.14);
    }

    .your-card small{
      display:block;
      margin-bottom:12px;
      font-size:.72rem;
      letter-spacing:.16em;
      opacity:.5;
    }

    .your-card strong{
      display:block;
      font-size:1.05rem;
      font-weight:400;
      line-height:1.8;
      letter-spacing:.05em;
    }

    .your-card p{
      margin:12px 0 0;
      font-size:.9rem;
      line-height:1.95;
      color:var(--ys-muted);
    }

    /* =========================
       SPEC
    ========================= */

    .your-specs{
      margin-top:40px;
      border-top:1px solid var(--ys-line);
    }

    .your-spec{
      display:grid;
      grid-template-columns:190px 1fr;
      gap:30px;
      padding:22px 10px;
      border-bottom:1px solid var(--ys-line);
      align-items:center;
    }

    .your-spec dt{
      font-size:.86rem;
      letter-spacing:.1em;
      opacity:.62;
    }

    .your-spec dd{
      margin:0;
      font-size:1rem;
      line-height:1.9;
    }

    /* =========================
       NOTE
    ========================= */

    .your-note{
      margin-top:38px;
      padding:28px 30px;
      border:1px solid rgba(180,205,255,.13);
      background:rgba(7,16,36,.14);
      line-height:2;
      color:var(--ys-muted);
      font-size:.9rem;
    }

    .your-note strong{
      font-weight:400;
      color:var(--ys-text);
    }

    /* =========================
       PRICE
    ========================= */

    .price-main{
      margin-top:34px;
      text-align:center;
      padding:38px 30px;
      border:1px solid var(--ys-line);
      background:rgba(7,16,36,.18);
    }

    .price-main strong{
      display:block;
      font-size:1.8rem;
      font-weight:400;
      letter-spacing:.08em;
    }

    .price-main span{
      display:block;
      margin-top:10px;
      font-size:.82rem;
      color:var(--ys-muted);
    }

    /* =========================
       PROCESS
    ========================= */

    .process-list{
      margin-top:40px;
      border-top:1px solid var(--ys-line);
    }

    .proc

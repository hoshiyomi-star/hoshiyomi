<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>あなたの世界｜星詠</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:#edf3ff;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(90,130,210,.12),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #040916 0%,
      #07142d 55%,
      #040916 100%
    );

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  line-height:1.9;
}


/* =========================
   共通
========================= */

.wrap{
  width:min(1100px,calc(100% - 40px));
  margin:auto;
}


/* =========================
   HEADER
========================= */

header{
  padding:90px 0 70px;
}

.header-system{
  text-align:center;

  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.3em;

  margin-bottom:40px;
}


/* =========================
   INTRO
========================= */

.intro{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:45px;

  align-items:stretch;
}


/* 左側 */

.intro-main{
  min-height:450px;

  padding:55px 45px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  text-align:center;

  border:
    1px solid
    rgba(180,205,245,.25);

  border-radius:38px;

  background:
    rgba(7,20,45,.28);
}

.intro-main h1{
  margin:0;

  font-size:
    clamp(2.5rem,5vw,4rem);

  font-weight:400;

  letter-spacing:.14em;

  line-height:1.5;
}

.intro-main .english{
  margin-top:25px;

  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.78rem;

  letter-spacing:.25em;
}

.intro-main .catch{
  margin:45px 0 0;

  font-size:1.15rem;

  line-height:2.2;

  letter-spacing:.08em;
}

.intro-main .description{
  margin:28px 0 0;

  color:#aab8d2;

  font-size:.88rem;

  line-height:2.2;
}


/* 右側 */

.intro-card{
  min-height:450px;

  padding:45px 35px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  border:
    1px solid
    rgba(180,205,245,.2);

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(30,62,115,.5),
      rgba(10,24,52,.58)
    );

  position:relative;

  overflow:hidden;
}

.intro-card::before{
  content:"";

  position:absolute;

  width:260px;
  height:260px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(120,170,255,.18),
      transparent 70%
    );

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  pointer-events:none;
}

.intro-card > *{
  position:relative;
  z-index:1;
}

.card-english{
  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.25em;

  margin-bottom:35px;
}

.intro-card h2{
  margin:0;

  font-size:1.9rem;

  font-weight:400;

  letter-spacing:.12em;
}

.card-line{
  width:45px;

  height:1px;

  margin:28px 0;

  background:
    rgba(180,205,245,.55);
}

.intro-card p{
  margin:0;

  color:#c5d1e7;

  font-size:.9rem;

  line-height:2.2;
}


/* =========================
   PLAN
========================= */

.plan-section{
  margin-top:90px;

  padding:
    70px 0 100px;

  border-top:
    1px solid
    rgba(180,205,245,.18);

  text-align:center;
}

.section-label{
  margin:0 0 12px;

  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.25em;
}

.plan-section h2{
  margin:0;

  font-size:2rem;

  font-weight:400;

  letter-spacing:.12em;
}

.plan-lead{
  margin:25px auto 55px;

  color:#aab8d2;

  font-size:.88rem;

  line-height:2.1;
}


/* =========================
   PLAN CARD
========================= */

.plan-card{
  max-width:700px;

  margin:auto;

  padding:45px 40px;

  border:
    1px solid
    rgba(180,205,245,.2);

  border-radius:24px;

  background:
    rgba(10,24,52,.55);
}

.plan-number{
  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.25em;
}

.plan-card h3{
  margin:20px 0 25px;

  font-size:1.5rem;

  font-weight:400;

  letter-spacing:.1em;
}

.price{
  margin:0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:2rem;

  letter-spacing:.08em;
}

.price-note{
  margin:12px 0 0;

  color:#8f9eb7;

  font-size:.78rem;
}

.plan-description{
  margin:30px auto 0;

  color:#aab8d2;

  font-size:.86rem;

  line-height:2.2;
}


/* =========================
   FLOW
========================= */

.flow{
  margin-top:70px;

  padding-top:55px;

  border-top:
    1px solid
    rgba(180,205,245,.12);
}

.flow h3{
  margin:0 0 30px;

  font-size:1.2rem;

  font-weight:400;

  letter-spacing:.1em;
}

.flow-list{
  display:flex;

  justify-content:center;

  gap:18px;

  flex-wrap:wrap;
}

.flow-item{
  color:#b9c7df;

  font-size:.82rem;

  letter-spacing:.05em;
}

.flow-arrow{
  color:#6f87aa;
}


/* =========================
   BACK
========================= */

.back{
  display:block;

  width:max-content;

  margin:
    0 auto 80px;

  padding:10px 24px;

  border:
    1px solid
    rgba(180,205,245,.2);

  border-radius:999px;

  color:#dce8ff;

  text-decoration:none;

  font-size:.82rem;

  transition:.3s ease;
}

.back:hover{
  background:
    rgba(180,210,255,.08);

  transform:translateY(-2px);
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .wrap{
    width:min(100% - 28px,1100px);
  }

  header{
    padding:65px 0 45px;
  }

  .intro{
    grid-template-columns:1fr;

    gap:20px;
  }

  .intro-main,
  .intro-card{
    min-height:360px;
  }

  .intro-main{
    padding:45px 25px;
  }

  .intro-main h1{
    font-size:2.5rem;
  }

  .plan-section{
    margin-top:65px;

    padding-top:55px;
  }

}


@media(max-width:450px){

  .intro-main,
  .intro-card{
    min-height:330px;
  }

  .intro-main h1{
    font-size:2.1rem;
  }

  .intro-main .catch{
    font-size:1rem;
  }

  .intro-card h2{
    font-size:1.6rem;
  }

  .plan-card{
    padding:35px 22px;
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="wrap">

    <div class="header-system">
      HOSHIYOMI / COMMISSION
    </div>


    <!-- =========================
         INTRO
    ========================= -->

    <div class="intro">


      <!-- 左：タイトル・説明 -->

      <div class="intro-main">

        <h1>
          あなたの世界
        </h1>

        <div class="english">
          YOUR WORLD
        </div>

        <p class="catch">
          あなたの中にある世界を、<br>
          一枚の作品に。
        </p>

        <p class="description">
          あなたの好きなものや記憶、憧れ、<br>
          頭の中にある景色や物語まで受け取りながら、<br>
          あなたの中にある「世界」を<br>
          一枚の作品へ仕上げます。
        </p>

      </div>


      <!-- 右：ビジュアルカード -->

      <div class="intro-card">

        <div class="card-english">
          YOUR WORLD
        </div>

        <h2>
          あなたの世界を、<br>
          一枚の星へ。
        </h2>

        <div class="card-line"></div>

        <p>
          記憶、物語、好きなもの。<br>
          あなたの中にある世界を<br>
          星詠の一枚に。
        </p>

      </div>


    </div>

  </div>

</header>



<!-- =========================
     PLAN
========================= -->

<main class="wrap">

  <section class="plan-section">

    <p class="section-label">
      PLAN
    </p>

    <h2>
      プラン・料金
    </h2>

    <p class="plan-lead">
      あなたの世界を形にするための基本プランです。<br>

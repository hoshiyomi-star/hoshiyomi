<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>送信完了｜星詠</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#edf3ff;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(90,130,210,.14),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #040916 0%,
      #07142d 55%,
      #040916 100%
    );

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  line-height:1.9;
}

.wrap{

  width:min(
    680px,
    calc(100% - 40px)
  );

  text-align:center;
}


/* SYSTEM */

.system{

  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.72rem;

  letter-spacing:.3em;

  margin-bottom:30px;
}


/* LOGO */

.logo{

  width:min(
    190px,
    55vw
  );

  height:auto;

  display:block;

  margin:0 auto 35px;

  filter:
    drop-shadow(
      0 0 20px
      rgba(150,190,255,.18)
    );
}


/* MESSAGE */

.message{

  padding:50px 35px;

  border:
    1px solid
    rgba(180,205,245,.18);

  border-radius:24px;

  background:
    rgba(10,24,52,.58);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.15);
}

.label{

  color:#8fbfff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:.7rem;

  letter-spacing:.25em;

  margin-bottom:18px;
}

h1{

  font-size:
    clamp(
      1.8rem,
      5vw,
      2.5rem
    );

  font-weight:400;

  letter-spacing:.12em;

  margin:0 0 25px;
}

.text{

  color:#aab8d2;

  font-size:.9rem;

  line-height:2.1;

  margin:0;
}

.small{

  margin-top:25px;

  color:#74839d;

  font-size:.75rem;

  line-height:1.9;
}


/* BUTTON */

.back{

  display:inline-block;

  margin-top:35px;

  padding:11px 25px;

  border:
    1px solid
    rgba(180,205,245,.2);

  border-radius:999px;

  color:#dce8ff;

  text-decoration:none;

  font-size:.82rem;

  letter-spacing:.08em;

  transition:.35s ease;
}

.back:hover{

  transform:translateY(-2px);

  background:
    rgba(180,210,255,.08);

  border-color:
    rgba(143,191,255,.5);

  box-shadow:
    0 0 25px
    rgba(143,191,255,.1);
}


/* MOBILE */

@media(max-width:700px){

  .wrap{

    width:min(
      100% - 28px,
      680px
    );

  }

  .message{

    padding:40px 22px;

  }

}

</style>

</head>


<body>


<main class="wrap">


  <div class="system">
    HOSHIYOMI REQUEST SYSTEM
  </div>


  <img
    src="logo.png"
    alt="星詠"
    class="logo"
  >


  <div class="message">


    <div class="label">
      REQUEST RECEIVED
    </div>


    <h1>
      あなたの星を、<br>
      受け取りました。
    </h1>


    <p class="text">

      ご依頼内容の送信が完了しました。<br><br>

      お送りいただいた内容を確認のうえ、<br>
      ご入力いただいたメールアドレスへ<br>
      ご連絡いたします。

    </p>


    <p class="small">

      ※この時点では、まだ正式なご依頼確定ではありません。<br>
      内容を確認後、制作についてご案内いたします。

    </p>


    <a
      href="index.html"
      class="back"
    >
      星詠の入口へ戻る
    </a>


  </div>


</main>


</body>
</html>

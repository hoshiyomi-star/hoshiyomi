<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信完了｜星詠</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  overflow-x:hidden;
  color:#edf3ff;
  font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;
  line-height:1.9;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(65,100,175,.15),transparent 48%),
    linear-gradient(180deg,#020611 0%,#07152d 55%,#030817 100%);
}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sky::before{
  content:"";position:absolute;inset:0;opacity:.28;
  background-image:
    radial-gradient(circle at 14% 17%,rgba(235,243,255,.9) 0 1px,transparent 1.8px),
    radial-gradient(circle at 83% 26%,rgba(205,225,255,.65) 0 1px,transparent 1.8px),
    radial-gradient(circle at 73% 67%,rgba(225,238,255,.65) 0 1px,transparent 1.8px),
    radial-gradient(circle at 24% 72%,rgba(195,220,255,.5) 0 1px,transparent 1.8px);
}
.page{
  position:relative;z-index:2;
  width:min(720px,calc(100% - 34px));
  min-height:100vh;
  margin:auto;
  padding:80px 0 70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}
.emblem{
  width:58px;height:58px;margin:0 auto 30px;
  border:1px solid rgba(190,215,255,.38);
  border-radius:50%;position:relative;opacity:.82;
}
.emblem::before,.emblem::after{
  content:"";position:absolute;left:50%;top:50%;
  background:rgba(215,230,255,.58);
  transform:translate(-50%,-50%);
}
.emblem::before{width:76px;height:1px}
.emblem::after{width:1px;height:76px}
.emblem span{
  position:absolute;inset:0;display:grid;place-items:center;font-size:20px;
}
.system{
  color:#9bbfff;font-family:Georgia,"Times New Roman",serif;
  font-size:.72rem;letter-spacing:.35em;margin-bottom:20px;
}
h1{
  margin:0;font-size:clamp(27px,5vw,38px);font-weight:400;
  letter-spacing:.14em;line-height:1.8;
}
.lead{
  margin:20px 0 34px;color:#b7c7df;font-size:.9rem;
  line-height:2.15;letter-spacing:.07em;
}
.message{
  width:min(620px,100%);
  margin:0 auto;
  padding:38px 30px;
  border:1px solid rgba(180,205,245,.20);
  border-radius:18px;
  background:rgba(8,22,48,.46);
  box-shadow:0 18px 55px rgba(0,0,0,.16);
}
.message p{
  margin:0 0 18px;color:#b9c7dc;font-size:.85rem;
  line-height:2.2;letter-spacing:.05em;
}
.message p:last-child{margin-bottom:0}
.buttons{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
  margin-top:32px;
}
.button{
  display:inline-block;padding:11px 24px;
  border:1px solid rgba(180,205,245,.22);
  border-radius:999px;color:#dce8ff;text-decoration:none;
  font-size:.78rem;letter-spacing:.08em;
  background:rgba(180,210,255,.03);
  transition:.3s ease;
}
.button:hover{
  transform:translateY(-2px);
  background:rgba(180,210,255,.08);
  border-color:rgba(180,205,245,.45);
}
.signature{
  margin-top:34px;color:#8192ad;font-size:.74rem;
  line-height:2;letter-spacing:.08em;
}
@media(max-width:560px){
  .page{padding:58px 0 48px}
  .message{padding:30px 20px}
}
</style>
</head>
<body>
<div class="sky"></div>

<main class="page">
  <div class="emblem"><span>✦</span></div>

  <div class="system">HOSHIYOMI / THANK YOU</div>

  <h1>星のかけらを、受け取りました。</h1>

  <p class="lead">
    ご依頼内容の送信が完了しました。
  </p>

  <section class="message">
    <p>
      あなたが届けてくださった言葉や資料をもとに、<br>
      これから一枚の作品へと形にしていきます。
    </p>

    <p>
      ご入力いただいたメールアドレス宛に、<br>
      受付内容についてのご連絡をお送りします。
    </p>

    <p>
      今しばらく、お待ちください。
    </p>
  </section>

  <div class="buttons">
    <a class="button" href="index.html">星詠のトップへ</a>
    <a class="button" href="request-choice.html">依頼メニューへ</a>
  </div>

  <p class="signature">
    ──────────────<br>
    星詠｜HOSHIYOMI<br>
    無限に広がる夜空から、あなただけの星を。
  </p>
</main>
</body>
</html>
